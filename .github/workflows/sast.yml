name: SAST

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  opengrep:
    name: OpenGrep (pinned baseline)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run the pinned, provenance-verified OpenGrep scan
        run: python3 -B scripts/run-sast.py --out sast/reports/ci-latest.json

      - name: Upload normalized report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengrep-sast-report
          path: sast/reports/ci-latest.json
          if-no-files-found: ignore
