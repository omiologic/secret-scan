name: Release

# One dispatch publishes the whole product in lockstep
# (decision-release-bindings-in-lockstep, decision-ship-first-release-artifact-set):
# the npm package, the `secret-scan` and `secret-scan-cli` crates, and the
# `omiologic-secret-scan` PyPI distribution. `ci`, `python-wheels`, and
# `artifact-qualification` call the qualification workflows as reusable
# workflows (issue #77, RB-7) so every publish job below -- `publish`,
# `publish-crates`, and `publish-pypi` -- gates on the exact same commit this
# workflow is running for, and `publish-pypi` downloads the wheels
# `python-wheels` already qualified rather than rebuilding them.
#
# `@omiologic/secret-scan-node`'s six platform packages and
# `@omiologic/secret-scan-wasm` are not published by this workflow: their
# manifests and `packages/javascript`'s `optionalDependencies`/`dependencies`
# on them exist now (issue #79), but the wrapper package itself is still the
# root `package.json` here (docs/rust-workspace.md, "Two manifests named
# @omiologic/secret-scan") until `RB-2` (issue #72) cuts over the published
# npm artifact to `packages/javascript` -- publishing its native and
# WebAssembly dependencies belongs to that same cutover, not to a routine
# release of the package this workflow still publishes.
#
# Registry publication is not transactional across three registries, so
# `record-manifest` runs `if: always()` and records the observed state of
# each of them, the way the npm-only manifest did before. `reconcile-release.yml`
# only reconciles the npm tag today; reconciling a partial crates.io or PyPI
# publication is not yet built and is not assumed by anything here.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # These call the qualification workflows as reusable workflows rather than
  # duplicating their jobs, so every publish job below gates on the exact
  # same commit this workflow is running for (`github.sha` is shared with
  # the caller) instead of a separate, potentially-stale CI run on the same
  # ref.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  python-wheels:
    name: Python wheels
    uses: ./.github/workflows/python-wheels.yml
    permissions:
      contents: read

  artifact-qualification:
    name: Artifact qualification
    uses: ./.github/workflows/artifact-qualification.yml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # `ci` covers the four ci.yml Rust jobs and the wasm32 job (rust-policy,
    # rust-native, rust-msrv, rust-wasm) plus the Node test matrix.
    # `artifact-qualification` is the Node addon, browser artifact, and CLI
    # qualification workflow issue #74 (RB-4) added.
    needs:
      - ci
      - python-wheels
      - artifact-qualification
    environment:
      name: release
    permissions:
      contents: write
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}

    steps:
      - name: Require the default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@omiologic'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          package_private=$(node -p "require('./package.json').private === true")

          if [[ "$package_private" == "true" ]]; then
            echo "The package is marked private." >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            if [[ "$package_version" != *-beta.* ]]; then
              echo "Only beta prereleases are configured." >&2
              exit 1
            fi
            npm_tag=beta
          else
            npm_tag=latest
          fi

          tag_name="v$package_version"
          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            echo "Tag $tag_name already exists." >&2
            exit 1
          fi

          set +e
          registry_result=$(npm view "$package_name@$package_version" version --json 2>&1)
          registry_status=$?
          set -e
          if [[ $registry_status -eq 0 ]]; then
            echo "$package_name@$package_version is already published." >&2
            exit 1
          fi
          if [[ "$registry_result" != *'"code": "E404"'* ]]; then
            echo "Could not prove that $package_name@$package_version is unpublished." >&2
            exit 1
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Qualify release
        run: npm run release:check

      - name: Release package
        run: npm run release -- --tag "${{ steps.release.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            published=$(npm view "${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.package_version }}" version 2>/dev/null || true)
            if [[ "$published" == "${{ steps.release.outputs.package_version }}" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "The published version could not be verified from npm." >&2
          exit 1

      - name: Create annotated Git tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        run: |
          tag_object=$(gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/tags" \
            --field tag="$TAG_NAME" \
            --field message="Release $PACKAGE_VERSION" \
            --field object="$GITHUB_SHA" \
            --field type=commit \
            --jq .sha)
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            --field ref="refs/tags/$TAG_NAME" \
            --field sha="$tag_object"

      # `if: always()` so a partial or failed release still reports what it
      # observed; `record-manifest` is what actually writes the manifest now
      # that more than one registry is involved.
      - name: Report npm registry state
        id: state
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./package.json').version" 2>/dev/null || true)
          state=unknown
          if [[ -n "$package_name" && -n "$version" ]]; then
            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              state=published
            else
              state=unpublished
            fi
          fi
          json=$(jq -n --arg artifact "npm:${package_name:-unknown}" --arg state "$state" '{($artifact): $state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: Publish crates.io
    needs: [ci, python-wheels, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}

    steps:
      - name: Require the default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate crate identity
        id: identity
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "secret-scan") | .version')
          for crate in secret-scan secret-scan-cli; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [[ "$status" == "200" ]]; then
              echo "$crate@$version is already published." >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Core first: secret-scan-cli's manifest depends on the registry
      # release of secret-scan, not the path in this checkout
      # (`cargo package -p secret-scan-cli` proves this locally by failing
      # until the core is actually on crates.io).
      - name: Publish secret-scan
        run: cargo publish -p secret-scan --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for secret-scan on crates.io
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/secret-scan/${{ steps.identity.outputs.version }}")
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "secret-scan could not be verified on crates.io." >&2
          exit 1

      - name: Publish secret-scan-cli
        run: cargo publish -p secret-scan-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Report crates.io registry state
        id: state
        if: always()
        shell: bash
        run: |
          version="${{ steps.identity.outputs.version }}"
          core_state=unknown
          cli_state=unknown
          if [[ -n "$version" ]]; then
            for crate in secret-scan secret-scan-cli; do
              status=$(curl -s -o /dev/null -w '%{http_code}' \
                "https://crates.io/api/v1/crates/$crate/$version")
              state=unpublished
              [[ "$status" == "200" ]] && state=published
              if [[ "$crate" == "secret-scan" ]]; then core_state=$state; else cli_state=$state; fi
            done
          fi
          json=$(jq -n \
            --arg core "crate:secret-scan" --arg core_state "$core_state" \
            --arg cli "crate:secret-scan-cli" --arg cli_state "$cli_state" \
            '{($core): $core_state, ($cli): $cli_state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

  publish-pypi:
    name: Publish PyPI
    needs: [ci, python-wheels, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}

    steps:
      - name: Require the default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download qualified wheels and source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: python-*
          merge-multiple: true

      # Reuses `scripts/qualify-python-wheel.py`'s own `workspace_version`
      # and `pep440_version` instead of restating the Cargo-to-PEP-440
      # conversion (`0.1.0-beta.1` -> `0.1.0b1`) a second time.
      - name: Determine the PyPI distribution identity
        id: identity
        shell: bash
        run: |
          read -r name version < <(python3 -B -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('qualify_python_wheel', 'scripts/qualify-python-wheel.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.policy()['python-distribution'], module.pep440_version(module.workspace_version()))
          ")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Trusted publishing (OIDC, `permissions.id-token: write` above): PyPI
      # must have a trusted publisher configured for this repository, the
      # `Release` workflow, and the `release` environment before this step
      # can succeed. There is no `NPM_TOKEN`-style secret to provision.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Report PyPI registry state
        id: state
        if: always()
        shell: bash
        run: |
          name="${{ steps.identity.outputs.name }}"
          version="${{ steps.identity.outputs.version }}"
          state=unknown
          if [[ -n "$name" && -n "$version" ]]; then
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")
            state=unpublished
            [[ "$status" == "200" ]] && state=published
          fi
          json=$(jq -n --arg artifact "pypi:${name:-unknown}" --arg state "$state" '{($artifact): $state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

  # Runs even when a publish job above failed, so a partial release still
  # leaves a durable record of what it attempted
  # (decision-release-bindings-in-lockstep and ARCHITECTURE.md's
  # "Versioning, qualification, and release" section).
  record-manifest:
    name: Record release manifest
    needs: [publish, publish-crates, publish-pypi]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build and record the manifest
        id: manifest
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version" 2>/dev/null || true)
          conformance_identity=$(git rev-parse "$GITHUB_SHA:conformance" 2>/dev/null || true)

          # A job that was skipped or failed before its own "report state"
          # step ran leaves its output empty, not `{}` -- default it here so
          # a partial release still yields a manifest instead of a jq error.
          npm_json='${{ needs.publish.outputs.registry_state_json }}'
          [[ -z "$npm_json" ]] && npm_json='{}'
          crates_json='${{ needs.publish-crates.outputs.registry_state_json }}'
          [[ -z "$crates_json" ]] && crates_json='{}'
          pypi_json='${{ needs.publish-pypi.outputs.registry_state_json }}'
          [[ -z "$pypi_json" ]] && pypi_json='{}'

          merged=$(jq -n \
            --argjson npm "$npm_json" \
            --argjson crates "$crates_json" \
            --argjson pypi "$pypi_json" \
            '$npm + $crates + $pypi')

          artifact_args=()
          registry_args=()
          while IFS= read -r key; do
            value=$(jq -r --arg k "$key" '.[$k]' <<<"$merged")
            artifact_args+=(--artifact "$key")
            registry_args+=(--registry-state "$key=$value")
          done < <(jq -r 'keys[]' <<<"$merged")

          python3 -B scripts/release-manifest.py \
            --source-revision "$GITHUB_SHA" \
            --conformance-identity "${conformance_identity:-unknown}" \
            --version "${version:-unknown}" \
            "${artifact_args[@]}" \
            "${registry_args[@]}" \
            --out manifest.json

          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ steps.manifest.outputs.version }}
          path: manifest.json
          if-no-files-found: error
