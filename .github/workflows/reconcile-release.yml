name: Reconcile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to reconcile
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable publication and reconcile tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if [[ "$REQUESTED_VERSION" != "$package_version" ]]; then
            echo "Requested version does not match package.json." >&2
            exit 1
          fi

          published_version=$(npm view "$package_name@$package_version" version 2>/dev/null || true)
          published_sha=$(npm view "$package_name@$package_version" gitHead 2>/dev/null || true)
          if [[ "$published_version" != "$package_version" || "$published_sha" != "$GITHUB_SHA" ]]; then
            echo "npm publication does not match the selected main commit." >&2
            exit 1
          fi

          tag_name="v$package_version"
          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            tag_sha=$(git rev-list -n 1 "$tag_name")
            tag_type=$(git cat-file -t "$tag_name")
            if [[ "$tag_sha" != "$GITHUB_SHA" || "$tag_type" != "tag" ]]; then
              echo "Existing tag conflicts with the verified publication." >&2
              exit 1
            fi
            echo "$tag_name already reconciles the publication."
            exit 0
          fi

          tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            --field tag="$tag_name" --field message="Release $package_version" \
            --field object="$GITHUB_SHA" --field type=commit --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --field ref="refs/tags/$tag_name" --field sha="$tag_object"
