[package]
name = "secret-scan"
description = "Deterministic secret detection and redaction core. Side-effect free: no runtime network, filesystem, environment, telemetry, secret storage, or UI."
keywords = ["secret-detection", "redaction", "security"]
categories = ["text-processing"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Publication is enabled by the release process, not by this scaffold.
publish.workspace = true

[lib]
name = "secret_scan"

[dependencies]
# Intentionally empty. Additions must pass scripts/check-rust-workspace.py,
# which enforces [workspace.metadata.secret-scan] in the root Cargo.toml.

[lints]
workspace = true
