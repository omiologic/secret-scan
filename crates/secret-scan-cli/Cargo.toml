[package]
name = "secret-scan-cli"
description = "Command-line interface built on the secret-scan core."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Publication runs only through the gated release process
# (decision-ship-first-release-artifact-set); this override is what makes
# `cargo publish -p secret-scan-cli` possible at all.
publish = true

[[bin]]
name = "secret-scan"
path = "src/main.rs"
# The binary is named for the product and the core library's path is
# `secret_scan`, which rustdoc writes to the same output directory. The CLI
# is a host adapter with no API to document, so it opts out of rustdoc.
doc = false

[dependencies]
secret-scan.workspace = true

[dev-dependencies]
# Test-only. Lets the canonical-corpus integration test read
# `conformance/fixtures/synchronous-corpus.json` directly instead of copying
# fixture values into Rust, which decision-govern-cross-language-conformance
# rejects. Mirrors `crates/secret-scan-core/Cargo.toml`'s dev-dependency of
# the same crate for the same reason.
serde_json = "1"

[lints]
workspace = true
