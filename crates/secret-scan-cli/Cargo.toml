[package]
name = "secret-scan-cli"
description = "Command-line interface built on the secret-scan core."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "secret-scan"
path = "src/main.rs"
# The binary is named for the product and the core library's path is
# `secret_scan`, which rustdoc writes to the same output directory. The CLI
# is a host adapter with no API to document, so it opts out of rustdoc.
doc = false

[dependencies]
secret-scan.workspace = true

[lints]
workspace = true
