[package]
name = "redact-secret-wasm"
description = "wasm-bindgen WebAssembly build exposing the redact-secret core to browsers."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redact-secret.workspace = true
wasm-bindgen.workspace = true
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Test-only: lets the unit tests below read
# `conformance/fixtures/unicode-conversion-corpus.json` directly instead of
# copying fixture values into Rust, which
# decision-govern-cross-language-conformance rejects.
serde_json = "1"

[lints]
workspace = true
