[package]
name = "secret-scan-node"
description = "N-API native addon exposing the secret-scan core to Node.js."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
secret-scan.workspace = true
napi.workspace = true
napi-derive.workspace = true

[build-dependencies]
napi-build.workspace = true

[dev-dependencies]
# Test-only: lets the unit tests below read
# `conformance/fixtures/unicode-conversion-corpus.json` directly instead of
# copying fixture values into Rust, which
# decision-govern-cross-language-conformance rejects.
serde_json = "1"

[lints]
workspace = true
